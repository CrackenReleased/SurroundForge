name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Verify SurroundForge Suite (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FFmpeg dev libs
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: surround/source/third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('surround/source/scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./surround/source/scripts/fetch-ffmpeg.ps1

      - name: Add FFmpeg to PATH
        shell: pwsh
        run: |
          $bin = [IO.Path]::GetFullPath("surround/source/third_party/ffmpeg/bin")
          if (Test-Path $bin) {
            echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Configure CMake
        run: cmake -S surround/source/engine -B surround/source/engine/build -G "Visual Studio 17 2022" -A x64 "-DVAC3_VERSION=0.1.16-local"

      - name: Build Engine, Tools & Unit Tests
        run: cmake --build surround/source/engine/build --config Release

      - name: Run Comprehensive Test Suite
        shell: pwsh
        run: ./surround/tests/Invoke-TestSuite.ps1 -Suite Offline
